# Копия workflow для удобства просмотра в папке ci/
# Рабочий файл CI: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_HTTP_SERVER=ON

      - name: build
        run: cmake --build build --parallel

      - name: test
        run: ctest --test-dir build --output-on-failure

      - name: package
        run: |
          mkdir -p dist
          cp build/taskflow_cli build/taskflow_tests build/taskflow_server dist/
          tar -czf taskflow-package.tar.gz -C dist .
